{% extends "base.html" %}

{% block content %}
<div class="py-20 bg-light min-h-screen">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary">💳 Make a Payment</h1>
            <p class="text-gray-500 mt-2">Payment preparation · Confirmation unavailable</p>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-8">
            <form id="payment-form">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Amount</label>
                        <input type="number" id="amount" name="amount" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" value="100.00" min="0.50" max="999999.99" step="0.01" required>
                    </div>
                    <p class="text-gray-500 text-sm">Card entry and payment confirmation are unavailable. Preparing a test payment intent does not complete a payment or mark an invoice paid.</p>
                    <button type="submit" id="pay-button" class="w-full bg-[#c9a96e] text-white py-3 rounded-lg hover:bg-[#b08a4a] transition">Prepare Test Payment</button>
                </div>
            </form>
            <div id="payment-result" class="mt-4 hidden"></div>
        </div>
    </div>
</div>

<script>
document.getElementById('payment-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const button = document.getElementById('pay-button');
    const resultDiv = document.getElementById('payment-result');
    
    button.textContent = 'Processing...';
    button.disabled = true;
    resultDiv.classList.add('hidden');
    
    const amount = document.getElementById('amount').value;
    
    try {
        const response = await fetch('/create-payment-intent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content },
            body: JSON.stringify({ amount: Math.round(Number(amount) * 100) })
        });
        
        const data = await response.json();
        
        if (response.ok && data.status === 'pending') {
            resultDiv.className = 'mt-4 p-4 bg-yellow-100 text-yellow-800 rounded-lg';
            resultDiv.textContent = 'Payment pending. No payment has been confirmed.';
            resultDiv.classList.remove('hidden');
        } else {
            resultDiv.className = 'mt-4 p-4 bg-red-100 text-red-700 rounded-lg';
            resultDiv.textContent = data.error || 'Payment preparation is unavailable.';
            resultDiv.classList.remove('hidden');
        }
    } catch (error) {
        resultDiv.className = 'mt-4 p-4 bg-red-100 text-red-700 rounded-lg';
        resultDiv.textContent = 'Payment preparation is unavailable. Please try again later.';
        resultDiv.classList.remove('hidden');
    }
    
    button.textContent = 'Prepare Test Payment';
    button.disabled = false;
});
</script>
{% endblock %}
