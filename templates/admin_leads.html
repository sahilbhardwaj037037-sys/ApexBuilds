{% extends "base.html" %}

{% block content %}
<div class="py-20 bg-light min-h-screen">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-primary">📋 All Leads</h1>
            <a href="/admin" class="text-gray-500 hover:text-gray-700">← Back to Admin</a>
        </div>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    {% for lead in leads %}
                    <tr>
                        <td class="px-6 py-4">{{ lead.name }}</td>
                        <td class="px-6 py-4">{{ lead.email }}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded-full text-xs font-semibold 
                                {% if lead.status == 'NEW' %}bg-yellow-100 text-yellow-700
                                {% elif lead.status == 'CONTACTED' %}bg-blue-100 text-blue-700
                                {% elif lead.status == 'CONVERTED' %}bg-green-100 text-green-700
                                {% else %}bg-gray-100 text-gray-700{% endif %}">
                                {{ lead.status }}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm">{{ lead.created_at.strftime('%b %d, %Y') }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">No leads yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
