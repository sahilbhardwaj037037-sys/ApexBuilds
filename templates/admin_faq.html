{% extends "base.html" %}

{% block content %}
<div class="py-20 bg-light min-h-screen">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-primary">❓ FAQ Management</h1>
            <a href="/admin/faq/new" class="bg-[#c9a96e] text-white px-6 py-2 rounded-lg hover:bg-[#b08a4a] transition">+ New FAQ</a>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-6">
            {% if faqs %}
                {% for faq in faqs %}
                <div class="border-b border-gray-100 py-4 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-primary">{{ faq.question }}</h3>
                        <p class="text-gray-500 text-sm mt-1">{{ faq.answer[:100] }}...</p>
                    </div>
                    <div class="flex gap-3">
                        <a href="/admin/faq/edit/{{ faq.id }}" class="text-blue-500 hover:text-blue-700 text-sm">✏️ Edit</a>
                        <a href="/admin/faq/delete/{{ faq.id }}" class="text-red-500 hover:text-red-700 text-sm" onclick="return confirm('Delete this FAQ?')">🗑️ Delete</a>
                    </div>
                </div>
                {% endfor %}
            {% else %}
            <div class="text-center py-12">
                <div class="text-6xl mb-4">❓</div>
                <h3 class="text-xl font-bold text-primary">No FAQs Yet</h3>
                <p class="text-gray-500 mt-2">Add your first FAQ!</p>
                <a href="/admin/faq/new" class="bg-[#c9a96e] text-white px-6 py-2 rounded-lg hover:bg-[#b08a4a] transition inline-block mt-4">+ Add FAQ</a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
