{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-20">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-primary">Reset Password</h2>
        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mt-4">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="bg-green-100 text-green-700 p-3 rounded-lg mt-4">{{ success }}</div>
        {% endif %}
        <form method="POST" class="mt-6 space-y-4">
            <input type="hidden" name="token" value="{{ token }}">
            <div>
                <label class="block text-sm font-medium text-gray-700">New Password</label>
                <input type="password" name="password" class="w-full px-4 py-2 border rounded-lg" required>
            </div>
            <button type="submit" class="w-full btn-primary">Reset Password</button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-4">
            <a href="/login" class="text-gold">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
