{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-20">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-primary">Welcome Back</h2>
        <p class="text-gray-500 text-center mt-2">Sign in to your account</p>
        
        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mt-4">{{ error }}</div>
        {% endif %}
        
        <form method="POST" class="mt-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" name="email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" placeholder="you@example.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" placeholder="••••••••" required>
            </div>
            <div class="text-right">
                <a href="/forgot-password" class="text-sm text-[#c9a96e] hover:text-[#b08a4a] transition">Forgot Password?</a>
            </div>
            <button type="submit" class="w-full btn-primary">Sign In</button>
        </form>
        
        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account? <a href="/register" class="text-[#c9a96e] hover:text-[#b08a4a] transition">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
