{% extends "base.html" %}

{% block content %}
<div class="py-20 bg-light min-h-screen">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-primary">{% if faq %}Edit{% else %}Add{% endif %} FAQ</h1>
            <a href="/admin/faq" class="text-gray-500 hover:text-gray-700">← Back</a>
        </div>
        
        <div class="bg-white rounded-xl shadow-lg p-8">
            <form method="POST">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Question</label>
                        <input type="text" name="question" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" value="{{ faq.question if faq else '' }}" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Answer</label>
                        <textarea name="answer" rows="4" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" required>{{ faq.answer if faq else '' }}</textarea>
                    </div>
                    <button type="submit" class="w-full bg-[#c9a96e] text-white py-3 rounded-lg hover:bg-[#b08a4a] transition">
                        {% if faq %}Update{% else %}Create{% endif %} FAQ
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
