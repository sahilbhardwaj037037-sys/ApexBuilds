{% extends "base.html" %}

{% block content %}
<section class="pt-32 pb-16 bg-gradient-to-br from-[#1a1a2e] via-[#16213e] to-[#0f0f1a]">
    <div class="container mx-auto px-4 text-center">
        <span class="text-[#c9a96e] text-sm font-semibold uppercase tracking-wider border-l-4 border-[#c9a96e] pl-4">FAQ</span>
        <h1 class="text-4xl md:text-5xl font-bold text-white mt-4">Frequently Asked Questions</h1>
        <p class="text-white/70 mt-4 max-w-2xl mx-auto">Find answers to common questions about our services and process.</p>
    </div>
</section>

<section class="section-padding bg-light">
    <div class="container mx-auto px-4 max-w-3xl">
        <div class="space-y-4">
            {% for faq in faqs %}
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <button class="faq-toggle w-full px-6 py-4 text-left flex justify-between items-center hover:bg-gray-50 transition" onclick="toggleFAQ(this)">
                    <span class="font-semibold text-primary">{{ faq.question }}</span>
                    <span class="text-[#c9a96e] text-2xl transition-transform duration-300">+</span>
                </button>
                <div class="faq-answer px-6 pb-4 hidden">
                    <p class="text-gray-600">{{ faq.answer }}</p>
                </div>
            </div>
            {% else %}
            <div class="text-center py-12 bg-white rounded-xl shadow-lg">
                <div class="text-6xl mb-4">❓</div>
                <h3 class="text-xl font-bold text-primary">No FAQs Yet</h3>
                <p class="text-gray-500 mt-2">Check back soon for answers to common questions.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<script>
function toggleFAQ(button) {
    const answer = button.nextElementSibling;
    const icon = button.querySelector('span:last-child');
    
    if (answer.classList.contains('hidden')) {
        answer.classList.remove('hidden');
        icon.textContent = '−';
        button.classList.add('bg-gray-50');
    } else {
        answer.classList.add('hidden');
        icon.textContent = '+';
        button.classList.remove('bg-gray-50');
    }
}
</script>
{% endblock %}
