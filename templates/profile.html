{% extends "base.html" %}

{% block content %}
<div class="py-20 bg-light min-h-screen">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-primary">✏️ Edit Profile</h1>
            <a href="/dashboard" class="text-gray-500 hover:text-gray-700">← Back to Dashboard</a>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-8">
            <form method="POST" action="/dashboard/profile/update">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">First Name</label>
                        <input type="text" name="first_name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" value="{{ user.first_name }}" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Last Name</label>
                        <input type="text" name="last_name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" value="{{ user.last_name }}" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" name="email" class="w-full px-4 py-2 border rounded-lg bg-gray-100" value="{{ user.email }}" disabled>
                        <p class="text-xs text-gray-400 mt-1">Email cannot be changed</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Phone</label>
                        <input type="text" name="phone" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" value="{{ user.phone or '' }}">
                    </div>
                    <button type="submit" class="w-full bg-[#c9a96e] text-white py-3 rounded-lg hover:bg-[#b08a4a] transition">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
