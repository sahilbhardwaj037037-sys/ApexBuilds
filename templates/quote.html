{% extends "base.html" %}

{% block content %}
<section class="pt-32 pb-16 bg-gradient-to-br from-[#1a1a2e] via-[#16213e] to-[#0f0f1a]">
    <div class="container mx-auto px-4 text-center">
        <span class="text-[#c9a96e] text-sm font-semibold uppercase tracking-wider border-l-4 border-[#c9a96e] pl-4">Request a Quote</span>
        <h1 class="text-4xl md:text-5xl font-bold text-white mt-4">Tell Us About Your Project</h1>
        <p class="text-white/70 mt-4 max-w-2xl mx-auto">Fill out the form below and we'll provide you with a detailed quote.</p>
    </div>
</section>

<section class="section-padding bg-light">
    <div class="container mx-auto px-4 max-w-3xl">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <form method="POST" action="/quote/submit">
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Full Name</label>
                            <input type="text" name="name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" name="email" class="w-full px-4 py-2 border rounded-lg" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Phone</label>
                        <input type="tel" name="phone" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Service</label>
                        <select name="service" class="w-full px-4 py-2 border rounded-lg">
                            <option value="">Select a service</option>
                            <option value="Residential Design">Residential Design</option>
                            <option value="Commercial Design">Commercial Design</option>
                            <option value="Renovation">Renovation</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Project Description</label>
                        <textarea name="description" rows="4" class="w-full px-4 py-2 border rounded-lg" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-[#c9a96e] text-white py-3 rounded-lg hover:bg-[#b08a4a] transition">Submit Quote</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
