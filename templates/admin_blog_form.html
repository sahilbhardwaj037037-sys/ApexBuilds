{% extends "base.html" %}

{% block content %}
<div class="py-20 bg-light min-h-screen">
    <div class="container mx-auto px-4 max-w-4xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-primary">Create New Blog Post</h1>
            <a href="/admin/blog" class="text-gray-500 hover:text-gray-700">← Back</a>
        </div>
        
        <div class="bg-white rounded-xl shadow-lg p-8">
            <form method="POST">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Title</label>
                        <input type="text" name="title" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Slug</label>
                        <input type="text" name="slug" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Excerpt</label>
                        <textarea name="excerpt" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" required></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Content</label>
                        <textarea name="content" rows="10" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" required></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Image URL</label>
                        <input type="text" name="image" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Category</label>
                            <input type="text" name="category" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]" value="General">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Status</label>
                            <select name="status" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-[#c9a96e]">
                                <option value="DRAFT">Draft</option>
                                <option value="PUBLISHED">Published</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-[#c9a96e] text-white py-3 rounded-lg hover:bg-[#b08a4a] transition">Create Post</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
