{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center section-padding bg-light">
    <div class="auth-card">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join ApexBuild Interiors</p>
        
        {% if error %}
        <div class="auth-error mt-4">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="bg-green-100 text-green-700 p-3 rounded-lg mt-4">{{ success }}</div>
        {% endif %}
        {% if success %}
        <div class="bg-green-100 text-green-700 p-3 rounded-lg mt-4">{{ success }}</div>
        {% endif %}
        
        <form method="POST" class="mt-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="auth-label">First Name</label>
                    <input type="text" name="first_name" class="auth-input" placeholder="John" required>
                </div>
                <div>
                    <label class="auth-label">Last Name</label>
                    <input type="text" name="last_name" class="auth-input" placeholder="Doe" required>
                </div>
            </div>
            <div>
                <label class="auth-label">Email Address</label>
                <input type="email" name="email" class="auth-input" placeholder="you@example.com" required>
            </div>
            <div>
                <label class="auth-label">Password</label>
                <input type="password" name="password" class="auth-input" placeholder="Min 8 characters" required>
            </div>
            <button type="submit" class="btn-primary w-full text-center">Create Account</button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? <a href="/login" class="auth-link">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
